name: Nekoray build matrix - cmake

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; must already exist in the repository (required for pack-only / publish)"
        required: false
      mode:
        description: "build-only = build only | pack-only = build, pack and sign, no Release | publish = build, pack, sign and create the Release"
        type: choice
        options:
          - build-only
          - pack-only
          - publish
        default: build-only
permissions:
  contents: read

jobs:
  build-go:
    strategy:
      matrix:
        cross_os: [windows, linux]
        cross_arch: [amd64]
        include:
          - cross_os: public_res
            cross_arch: public_res
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7
      - name: Go Status
        env:
          NKR_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.NKR_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          git ls-files go | xargs cat | sha1sum > go_status
          printf '%s' "$NKR_UPDATE_PUBLIC_KEY_BASE64" | sha1sum >> go_status
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('libs/*.sh', 'go_status', '*.txt') }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        env:
          NKR_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.NKR_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          if [ "${{ matrix.cross_os }}" != "public_res" ] && [ -z "${NKR_UPDATE_PUBLIC_KEY_BASE64:-}" ]; then
            echo "NKR_UPDATE_PUBLIC_KEY_BASE64 is required to build update-capable release binaries."
            exit 1
          fi
          [ ${{ matrix.cross_os }} == public_res ] || ./libs/get_source.sh
          [ ${{ matrix.cross_os }} == public_res ] || GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./libs/build_go.sh
          [ ${{ matrix.cross_os }} == public_res ] || exit 0
          ./libs/build_public_res.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czvf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NekoRay-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
  build-cpp:
    strategy:
      matrix:
        include:
          - platform: windows-2022
            arch: x64
            qt_version: "6.7"
          - platform: ubuntu-latest
            arch: x64
            qt_version: "5.12"
      fail-fast: false

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 300
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install MSVC compiler
        if: matrix.platform == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          # 14.1 is for vs2017, 14.2 is vs2019, following the upstream vcpkg build from Qv2ray-deps repo
          toolset: 14.2
          arch: ${{ matrix.arch }}
      # ========================================================================================================= Qt Install
      - name: Windows - Download Custom Qt ${{ matrix.qt_version }} SDK
        shell: bash
        if: matrix.platform == 'windows-2022'
        env:
          DL_QT_VER: ${{ matrix.qt_version }}
        run: bash ./libs/download_qtsdk_win.sh
      # ========================================================================================================= 编译与 Qt 无关的依赖
      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      - name: Cache Download
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: libs/deps
          key: DepsCache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('libs/build_deps_*.sh') }}-Qt${{ matrix.qt_version }}
      - name: Build Dependencies
        shell: bash
        if: steps.cache-deps.outputs.cache-hit != 'true' && matrix.platform != 'ubuntu-latest'
        run: ./libs/build_deps_all.sh
      - name: Build Dependencies (Docker)
        shell: bash
        if: steps.cache-deps.outputs.cache-hit != 'true' && matrix.platform == 'ubuntu-latest'
        run: |
          docker run --rm \
            -v $PWD:/nekoray \
            -w /nekoray \
            ghcr.io/matsuridayo/debian10-qt5:20230131 \
            bash -c "./libs/build_deps_all.sh"
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: matrix.platform == 'windows-2022'
        env:
          DL_QT_VER: ${{ matrix.qt_version }}
          CC: cl.exe
          CXX: cl.exe
        run: |
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          mkdir build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release ..
          ninja -j2
          cd ..
          ./libs/deploy_windows64.sh
      - name: Linux - Generate MakeFile and Build
        shell: bash
        if: matrix.platform == 'ubuntu-latest'
        run: |
          docker run --rm \
            -v $PWD:/nekoray \
            -w /nekoray \
            ghcr.io/matsuridayo/debian10-qt5:20230131 \
            bash -c "mkdir build && pushd build && cmake -GNinja -DCMAKE_BUILD_TYPE=Release .. && ninja && popd &&./libs/deploy_linux64.sh"
      # ========================================================================================================= Deployments
      - name: Tar files
        shell: bash
        run: tar czvf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NekoRay-${{ github.sha }}-${{ matrix.platform }}-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: artifacts.tgz
  publish:
    name: Pack & Publish Release
    # Fail safe: any empty or unknown mode leaves this job (and the Release) untouched.
    if: github.event.inputs.mode == 'pack-only' || github.event.inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write     # gh release 需要该权限来创建 / 删除 Release
    needs:
      - build-cpp
      - build-go
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7
      - name: Validate inputs
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "The 'tag' input is required when mode is 'pack-only' or 'publish'."
            exit 1
          fi
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: download-artifact
      - name: Pack
        run: |
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          cp -r public_res/* linux64
          cp -r public_res/* windows64
          rm -rf public_res *.pdb
          ####
          mv linux64 nekoray
          zip -r $version_standalone-linux64.zip nekoray
          rm -rf nekoray
          ####
          mv windows64 nekoray
          zip -r $version_standalone-windows64.zip nekoray
          rm -rf nekoray
      - name: Pack Debian
        run: |
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          cp -r public_res/* linux64
          ####
          bash ../libs/package_debian.sh ${{ github.event.inputs.tag }}
          mv nekoray.deb $version_standalone-debian-x64.deb
          sudo rm -rf nekoray
      - name: Pack AppImage
        run: |
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          cp -r public_res/* linux64
          ####
          bash ../libs/package_appimage.sh
          mv nekobox-x86_64.AppImage $version_standalone-linux-x64.AppImage
      - name: Install Go for signing
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: go/cmd/update_signer/go.mod
      - name: Verify update signing key pair
        env:
          NKR_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.NKR_UPDATE_PRIVATE_KEY_BASE64 }}
          NKR_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.NKR_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          if [ -z "${NKR_UPDATE_PRIVATE_KEY_BASE64:-}" ] || [ -z "${NKR_UPDATE_PUBLIC_KEY_BASE64:-}" ]; then
            echo "Both NKR_UPDATE_PRIVATE_KEY_BASE64 and NKR_UPDATE_PUBLIC_KEY_BASE64 are required: the public key is compiled into the binaries and must match the key used for signing."
            exit 1
          fi
          # Fail before signing if the key pair diverged; otherwise clients would reject
          # every published update and the breakage would only show up on user machines.
          go run ./go/cmd/update_signer/main.go -check-keys
      - name: Sign update packages
        env:
          NKR_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.NKR_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "${NKR_UPDATE_PRIVATE_KEY_BASE64:-}" ]; then
            echo "NKR_UPDATE_PRIVATE_KEY_BASE64 is required to publish signed update packages."
            exit 1
          fi
          cd deployment
          go run ../go/cmd/update_signer/main.go ./*.zip
      - name: Clean Up
        run: |
          cd deployment
          rm -rf linux64
          rm -rf windows64
          rm -rf public_res
          rm -rf *.pdb
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
      - name: Release
        if: github.event.inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          # This step used to download ghr v0.13.0 (2021) with `curl | tar` and execute it
          # while holding a write token, with no integrity check. Use the runner's
          # preinstalled gh CLI instead: no unverified third-party binary is executed.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "deleting existing release for $tag (the git tag itself is kept)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi

          mapfile -t assets < <(find deployment -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.zip.sig' -o -name '*.deb' -o -name '*.AppImage' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found under deployment/"
            exit 1
          fi
          printf 'uploading %d asset(s):\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          # --notes "" keeps the release body empty, matching the previous ghr behaviour.
          # --verify-tag aborts instead of silently creating the tag from the default branch.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "" \
            --verify-tag \
            "${assets[@]}"
